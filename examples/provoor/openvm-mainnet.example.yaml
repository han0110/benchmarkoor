# mainnet suite, one day of blocks
global:
  log_level: info

runner:
  client_logs_to_stdout: true
  container_network: benchmarkoor
  cleanup_on_start: false
  # The forwarder listens only after worker readiness and a warmup proof.
  ready_timeout: 15m

  # Per-block metrics from the sidecars provoor runs on every node. The kind
  # of each endpoint selects the series recorded from it, so no metric list
  # belongs here. Counters are subtracted over each block and gauges are
  # averaged.
  remote_metrics:
    enabled: true
    interval: 100ms
    endpoints:
      - kind: dcgm-exporter
        url: http://${NODE1_IP}:9401/metrics
        labels: { node: node1 }
        device_ids: [0, 1, 2, 3]
      - kind: dcgm-exporter
        url: http://${NODE2_IP}:9401/metrics
        labels: { node: node2 }
        device_ids: [0, 1, 2, 3]
      - kind: dcgm-exporter
        url: http://${NODE3_IP}:9401/metrics
        labels: { node: node3 }
        device_ids: [0, 1, 2, 3]
      - kind: dcgm-exporter
        url: http://${NODE4_IP}:9401/metrics
        labels: { node: node4 }
        device_ids: [0, 1, 2, 3]
      - kind: node-exporter
        url: http://${NODE1_IP}:9402/metrics
        labels: { node: node1 }
      - kind: node-exporter
        url: http://${NODE2_IP}:9402/metrics
        labels: { node: node2 }
      - kind: node-exporter
        url: http://${NODE3_IP}:9402/metrics
        labels: { node: node3 }
      - kind: node-exporter
        url: http://${NODE4_IP}:9402/metrics
        labels: { node: node4 }

  benchmark:
    results_dir: ./results
    system_resource_collection_enabled: false
    tests:
      metadata:
        labels:
          name: "zkVM stateless validation, mainnet blocks 25950000-25957199"
      source:
        eest_fixtures:
          r2_bucket_url: https://github.com/han0110/benchmarkoor/releases/download/mainnet-stateless-inputs-25950000-25959999
          r2_bucket_starting_block: 25950000
          r2_bucket_blocks: 7200

  instances:
    - id: reth-openvm
      client: provoor
      image: ghcr.io/han0110/provoor/provoor:latest
      metadata:
        labels:
          zkvm: openvm
          stateless_validator: reth
      extra_args:
        - --zkvm=openvm
        - --stateless-validator=reth
        - --elf=https://github.com/eth-act/ere-guests/releases/download/v0.17.0/stateless-validator-reth-openvm-v2.1.0-preview.elf
        - --vk=https://github.com/eth-act/ere-guests/releases/download/v0.17.0/stateless-validator-reth-openvm-v2.1.0-preview.vk
        - --coordinator-endpoint=http://${COORDINATOR_IP}:3000
