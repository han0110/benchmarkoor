# EEST v21.0.5 suite
global:
  log_level: info

runner:
  client_logs_to_stdout: true
  container_network: benchmarkoor
  cleanup_on_start: false
  # The forwarder listens only after worker readiness and a warmup proof.
  ready_timeout: 15m

  # Per-block metrics from the sidecars provoor runs on every node. The kind
  # of each endpoint selects the series recorded from it, so no metric list
  # belongs here. Counters are subtracted over each block and gauges are
  # averaged.
  remote_metrics:
    enabled: true
    interval: 100ms
    endpoints:
      - kind: dcgm-exporter
        url: http://${NODE1_IP}:9401/metrics
        labels: { node: node1 }
        device_ids: [0, 1, 2, 3]
      - kind: dcgm-exporter
        url: http://${NODE2_IP}:9401/metrics
        labels: { node: node2 }
        device_ids: [0, 1, 2, 3]
      - kind: dcgm-exporter
        url: http://${NODE3_IP}:9401/metrics
        labels: { node: node3 }
        device_ids: [0, 1, 2, 3]
      - kind: dcgm-exporter
        url: http://${NODE4_IP}:9401/metrics
        labels: { node: node4 }
        device_ids: [0, 1, 2, 3]
      - kind: node-exporter
        url: http://${NODE1_IP}:9402/metrics
        labels: { node: node1 }
      - kind: node-exporter
        url: http://${NODE2_IP}:9402/metrics
        labels: { node: node2 }
      - kind: node-exporter
        url: http://${NODE3_IP}:9402/metrics
        labels: { node: node3 }
      - kind: node-exporter
        url: http://${NODE4_IP}:9402/metrics
        labels: { node: node4 }

  benchmark:
    results_dir: ./results
    system_resource_collection_enabled: false
    tests:
      metadata:
        labels:
          name: "zkVM stateless validation, eest v21.0.5, 60M 100M 150M gas"
      source:
        eest_fixtures:
          github_repo: ethereum/execution-specs
          github_release: tests-zkevm-benchmark@v21.0.5
          fixtures_url:
            - https://github.com/ethereum/execution-specs/releases/download/tests-zkevm-benchmark@v21.0.5/fixtures_zkevm-benchmark_0060M.tar.gz
            - https://github.com/ethereum/execution-specs/releases/download/tests-zkevm-benchmark@v21.0.5/fixtures_zkevm-benchmark_0100M.tar.gz
            - https://github.com/ethereum/execution-specs/releases/download/tests-zkevm-benchmark@v21.0.5/fixtures_zkevm-benchmark_0150M.tar.gz
          fixtures_subdir: fixtures/blockchain_tests

  instances:
    - id: reth-zisk
      client: provoor
      image: ghcr.io/han0110/provoor/provoor:latest
      metadata:
        labels:
          zkvm: zisk
          zkvm_version: v1.3.1-alpha
          stateless_validator: reth
          stateless_validator_version: v0.1.0-rc.3
      extra_args:
        - --zkvm=zisk
        - --stateless-validator=reth
        - --elf=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-reth-zisk-v1.3.1-alpha.elf
        - --vk=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-reth-zisk-v1.3.1-alpha.vk
        - --coordinator-endpoint=http://${COORDINATOR_IP}:7000
    - id: ethrex-zisk
      client: provoor
      image: ghcr.io/han0110/provoor/provoor:latest
      metadata:
        labels:
          zkvm: zisk
          zkvm_version: v1.3.1-alpha
          stateless_validator: ethrex
          stateless_validator_version: v26.0.0-rc.1
      extra_args:
        - --zkvm=zisk
        - --stateless-validator=ethrex
        - --elf=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-ethrex-zisk-v1.3.1-alpha.elf
        - --vk=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-ethrex-zisk-v1.3.1-alpha.vk
        - --coordinator-endpoint=http://${COORDINATOR_IP}:7000
