# sepolia suite
global:
  log_level: info

runner:
  client_logs_to_stdout: true
  container_network: benchmarkoor
  cleanup_on_start: false
  # The forwarder listens only after worker readiness and a warmup proof.
  ready_timeout: 15m

  # Per-block metrics from the sidecars provoor runs on every node. The kind
  # of each endpoint selects the series recorded from it, so no metric list
  # belongs here. Counters are subtracted over each block and gauges are
  # averaged.
  remote_metrics:
    enabled: true
    interval: 100ms
    endpoints:
      - kind: dcgm-exporter
        url: http://${NODE1_IP}:9401/metrics
        labels: { node: node1 }
        device_ids: [0, 1, 2, 3]
      - kind: dcgm-exporter
        url: http://${NODE2_IP}:9401/metrics
        labels: { node: node2 }
        device_ids: [0, 1, 2, 3]
      - kind: dcgm-exporter
        url: http://${NODE3_IP}:9401/metrics
        labels: { node: node3 }
        device_ids: [0, 1, 2, 3]
      - kind: dcgm-exporter
        url: http://${NODE4_IP}:9401/metrics
        labels: { node: node4 }
        device_ids: [0, 1, 2, 3]
      - kind: node-exporter
        url: http://${NODE1_IP}:9402/metrics
        labels: { node: node1 }
      - kind: node-exporter
        url: http://${NODE2_IP}:9402/metrics
        labels: { node: node2 }
      - kind: node-exporter
        url: http://${NODE3_IP}:9402/metrics
        labels: { node: node3 }
      - kind: node-exporter
        url: http://${NODE4_IP}:9402/metrics
        labels: { node: node4 }

  benchmark:
    results_dir: ./results
    system_resource_collection_enabled: false
    tests:
      metadata:
        labels:
          name: "zkVM stateless validation, sepolia blocks 11856500-11857499"
      source:
        eest_fixtures:
          r2_bucket_url: https://pub-afa6b160acfb4919bda1d0e2a00b5b77.r2.dev/testnets/sepolia
          r2_bucket_starting_block: 11856500
          r2_bucket_blocks: 1000
          fixtures_subdir: blockchain_tests_engine

  instances:
    - id: reth-zisk
      client: provoor
      image: ghcr.io/han0110/provoor/provoor:latest
      metadata:
        labels:
          zkvm: zisk
          zkvm_version: v1.3.1-alpha
          stateless_validator: reth
          stateless_validator_version: v0.1.0-rc.4
      extra_args:
        - --zkvm=zisk
        - --stateless-validator=reth
        - --elf=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-reth-zisk-v1.3.1-alpha.elf
        - --vk=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-reth-zisk-v1.3.1-alpha.vk
        - --coordinator-endpoint=http://${COORDINATOR_IP}:7000
    - id: ethrex-zisk
      client: provoor
      image: ghcr.io/han0110/provoor/provoor:latest
      metadata:
        labels:
          zkvm: zisk
          zkvm_version: v1.3.1-alpha
          stateless_validator: ethrex
          stateless_validator_version: v29.0.0
      extra_args:
        - --zkvm=zisk
        - --stateless-validator=ethrex
        - --elf=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-ethrex-zisk-v1.3.1-alpha.elf
        - --vk=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-ethrex-zisk-v1.3.1-alpha.vk
        - --coordinator-endpoint=http://${COORDINATOR_IP}:7000
    - id: nimbus-zisk
      client: provoor
      image: ghcr.io/han0110/provoor/provoor:latest
      metadata:
        labels:
          zkvm: zisk
          zkvm_version: v1.3.1-alpha
          stateless_validator: nimbus
          stateless_validator_version: v0.2.1-alpha
      extra_args:
        - --zkvm=zisk
        - --stateless-validator=nimbus
        - --elf=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-nimbus-zisk-v1.3.1-alpha.elf
        - --vk=https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-nimbus-zisk-v1.3.1-alpha.vk
        - --coordinator-endpoint=http://${COORDINATOR_IP}:7000
